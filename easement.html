const ITERATIONS = 600000;
function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  const btn = document.getElementById('go');
  err.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Checking…';
  try {
    const raw = b64ToBytes(PAYLOAD);
    const salt = raw.slice(0, 16);
    const iv = raw.slice(16, 28);
    const data = raw.slice(28); // ciphertext + 16-byte GCM tag
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey('raw', enc.encode(document.getElementById('pw').value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: ITERATIONS, hash: 'SHA-256' }, baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, data);
    const html = new TextDecoder().decode(plain);
    document.open();
    document.write(html);
    document.close();
  } catch (e2) {
    err.textContent = 'Wrong password — please try again.';
    btn.disabled = false;
    btn.textContent = 'Open';
  }
});
